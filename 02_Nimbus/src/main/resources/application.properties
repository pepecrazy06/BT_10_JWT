spring.application.name=JWT_Nimbus
server.port=8005
spring.profiles.default=mysql
spring.jpa.open-in-view=false
security.jwt.expiration-time=3600000
security.jwt.issuer=jwt-class-demo
# Local classroom demo only. Replace via environment for any real deployment.
security.jwt.secret-key=${JWT_SECRET:classroom-demo-only-change-this-key-2026-32bytes}
server.error.include-message=never
